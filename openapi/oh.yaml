      required:
      - endDate
      - positioning
      - startDate
      type: object
      properties:
        id:
          type: integer
          format: int64
        positioning:
          type: integer
          format: int32
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        closed:
          type: boolean
        trimester:
          $ref: '#/components/schemas/TrimesterDTO'
        isTestSequence:
          type: boolean
    SessionDTO:
      required:
      - name
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        closed:
          type: boolean
        studentNumber:
          type: integer
          format: int32
        trimesterSize:
          type: integer
          format: int32
        sequenceSize:
          type: integer
          format: int32
        firstSeqStartDate:
          type: string
          format: date-time
        sequenceDuration:
          type: integer
          format: int32
        firstHolidaysStartDate:
          type: string
          format: date-time
        firstHolidaysEndDate:
          type: string
          format: date-time
        secondHolidaysStartDate:
          type: string
          format: date-time
        secondHolidaysEndDate:
          type: string
          format: date-time
    TrimesterDTO:
      required:
      - endDate
      - positioning
      - startDate
      type: object
      properties:
        id:
          type: integer
          format: int64
        positioning:
          type: integer
          format: int32
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        session:
          $ref: '#/components/schemas/SessionDTO'
        listeSeq:
          type: array
          items:
            type: integer
            format: int64
        sequences:
          type: array
          items:
            $ref: '#/components/schemas/SequenceDTO'
    Session:
      required:
      - closed
      - endDate
      - name
      - startDate
      type: object
      properties:
        createdBy:
          type: string
        createdDate:
          type: string
          format: date-time
        lastModifiedBy:
          type: string
        lastModifiedDate:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        name:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        closed:
          type: boolean
        trimesterSize:
          type: integer
          format: int32
        sequenceSize:
          type: integer
          format: int32
        firstSeqStartDate:
          type: string
          format: date-time
        sequenceDuration:
          type: integer
          format: int32
        firstHolidaysStartDate:
          type: string
          format: date-time
        firstHolidaysEndDate:
          type: string
          format: date-time
        secondHolidaysStartDate:
          type: string
          format: date-time
        secondHolidaysEndDate:
          type: string
          format: date-time
        studentNumber:
          type: integer
          format: int32
